# 部署：push main 后构建 Astro 站点并发布到 GitHub Pages
# 触发：push main / 手动 workflow_dispatch
# 产出：dist/ 作为 Pages artifact 上线
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 注：rolldown@1.2.10 的 linux-arm64-musl binding 未发布，npm 解析其可选依赖会
      # 崩溃（Invalid Version），package.json overrides 已钉到健康的 1.2.9，此处可正常 npm ci
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 贡献热力图 + 公开动态 + 网易云歌单预取：无 Secret / 失效时脚本自动跳过并保留现有数据
      - name: Fetch GitHub data
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-contributions.mjs
          node scripts/fetch-events.mjs
          node scripts/fetch-netease.mjs
          node scripts/fetch-bangumi.mjs

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
